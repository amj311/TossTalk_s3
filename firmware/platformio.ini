[env]
platform = espressif32
framework = arduino
monitor_speed = 115200
lib_deps = 
  m5stack/M5Unified @ ^0.2.2
  h2zero/NimBLE-Arduino @ ^1.4.2
build_flags = 
  -DCORE_DEBUG_LEVEL=1
  -DCONFIG_BT_NIMBLE_MSYS1_BLOCK_COUNT=24

[env:m5stick-c-plus2]
board = m5stick-c
; M5Unified automatically detects Plus2, but we ensure the base board is set
build_flags = ${env.build_flags}

[env:m5stick-s3]
board = esp32-s3-devkitc-1
; These flags are critical for the S3's flash and PSRAM configuration
board_build.arduino.memory_type = qio_opi 
board_build.flash_mode = qio
build_flags = 
  ${env.build_flags}
  -DARDUINO_M5StickC_S3